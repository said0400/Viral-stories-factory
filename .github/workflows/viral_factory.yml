name: Viral Stories Factory

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      number_of_stories:
        description: "Number of stories for this run (empty = automatic)"
        required: false
        default: ""

      dry_run:
        description: "Dry run (no Blogger / WhatsApp / history changes)"
        type: boolean
        default: true

      manual_override:
        description: "Ignore the daily target (manual runs only)"
        type: boolean
        default: false

      dry_run_generate_images:
        description: "Generate images during a dry run (uses image provider quota)"
        type: boolean
        default: false

concurrency:
  group: viral-content-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"

      # Scheduled runs are always LIVE (false).
      # Manual runs follow the dry_run input.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

      NUMBER_OF_STORIES: ${{ inputs.number_of_stories }}

      MANUAL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_override || 'false' }}

      DRY_RUN_GENERATE_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run_generate_images || 'false' }}

      # Images are pushed during execution so Blogger receives public URLs.
      # Never push anything during a dry run.
      GIT_PUSH_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'false' || 'true' }}

      # Public base URL of the pushed images (requires a public repository).
      # Override with a repository variable named IMAGE_PUBLIC_BASE_URL if needed.
      IMAGE_PUBLIC_BASE_URL: ${{ vars.IMAGE_PUBLIC_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}/data/images', github.repository, github.ref_name) }}

      TARGET_DAILY_STORIES: ${{ vars.TARGET_DAILY_STORIES || '6' }}
      MAX_STORIES_PER_RUN: ${{ vars.MAX_STORIES_PER_RUN || '3' }}
      MAX_SOURCE_AGE_HOURS: ${{ vars.MAX_SOURCE_AGE_HOURS || '48' }}
      MIN_VIRAL_SCORE: ${{ vars.MIN_VIRAL_SCORE || '60' }}

      PEOPLE_IMAGE_STYLE: ${{ vars.PEOPLE_IMAGE_STYLE || 'reference' }}
      IMAGE_REQUIRED: ${{ vars.IMAGE_REQUIRED || 'true' }}
      FACEBOOK_LAYOUT: ${{ vars.FACEBOOK_LAYOUT || 'auto' }}

      DAY_TIMEZONE: ${{ vars.DAY_TIMEZONE || 'Africa/Casablanca' }}

      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-lite-image' }}

      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'cloudflare' }}
      CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL || '@cf/black-forest-labs/flux-2-dev' }}
      CLOUDFLARE_IMAGE_STEPS: ${{ vars.CLOUDFLARE_IMAGE_STEPS || '25' }}
      IMAGE_LONG_SIDE: ${{ vars.IMAGE_LONG_SIDE || '1536' }}
      CLOUDFLARE_TIMEOUT: ${{ vars.CLOUDFLARE_TIMEOUT || '300' }}

      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL || 'qwen/qwen3.8-27b' }}

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
      YOUR_PERSONAL_NUMBER: ${{ secrets.YOUR_PERSONAL_NUMBER }}
      WHATSAPP_CONTENT_SID: ${{ secrets.WHATSAPP_CONTENT_SID }}

      GEMINI_CONTENT_MODEL: ${{ vars.GEMINI_CONTENT_MODEL || 'gemini-3.8-flash' }}
      GEMINI_CONTENT_FALLBACKS: ${{ vars.GEMINI_CONTENT_FALLBACKS || 'gemini-3.6-flash,gemini-3.5-flash' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "viral-factory-bot"
          git config user.email "viral-factory-bot@users.noreply.github.com"

      - name: Run factory
        run: python -m src.main

      # Safety net: persist history/cache changes if the factory stopped midway.
      # Generated images are intentionally NOT added here because
      # image_publisher.py already pushes them during execution.
      - name: Commit state
        if: always() && env.DRY_RUN != 'true'
        run: |
          git add data/history.json 2>/dev/null || true
          git add data/cache 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update factory state [skip ci]"

            pushed=false

            for i in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi

              git pull --rebase --autostash || {
                git rebase --abort || true
                break
              }

              sleep $((i * 3))
            done

            if [ "$pushed" != "true" ]; then
              echo "::warning::Could not push factory state after 3 attempts."
            fi
          fi

      # Downloadable story ZIP bundles.
      # Export failures must never fail the workflow.
      - name: Upload downloadable story bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-bundles-${{ github.run_id }}
          path: |
            data/exports/
            data/dry_run/exports/
          if-no-files-found: ignore
          retention-days: 14

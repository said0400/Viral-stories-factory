name: Probe Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Cloudflare probe
        run: python scripts/probe_cloudflare_ref.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-probe-${{ github.run_id }}
          path: probe_out/
          if-no-files-found: ignore
          retention-days: 7

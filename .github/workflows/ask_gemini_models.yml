name: Ask Gemini Models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run model probe
        run: python scripts/ask_gemini_models.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: models-probe-${{ github.run_id }}
          path: probe_out/
          if-no-files-found: ignore
          retention-days: 7

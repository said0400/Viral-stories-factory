name: Test Facebook Image

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "Article page URL (images are extracted automatically)"
        required: false
        default: ""
      image_urls:
        description: "Direct image URLs separated by spaces (optional)"
        required: false
        default: ""
      layout:
        description: "auto | all | inset_circle_right | diptych_split | triptych ..."
        required: false
        default: "all"
      no_ai:
        description: "Skip vision analysis (center crops, no LLM calls)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_CONTENT_MODEL: ${{ vars.GEMINI_CONTENT_MODEL || 'gemini-3.8-flash' }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL || 'qwen/qwen3.8-27b' }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Inputs go through env to avoid shell injection.
      IN_ARTICLE: ${{ inputs.article_url }}
      IN_URLS: ${{ inputs.image_urls }}
      IN_LAYOUT: ${{ inputs.layout }}
      IN_NO_AI: ${{ inputs.no_ai }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Facebook image test
        run: |
          args=(--layout "$IN_LAYOUT")
          [ -n "$IN_ARTICLE" ] && args+=(--article-url "$IN_ARTICLE")
          for u in $IN_URLS; do args+=(--image-url "$u"); done
          [ "$IN_NO_AI" = "true" ] && args+=(--no-ai)
          python -m src.test_facebook "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-test-${{ github.run_id }}
          path: data/test_facebook/
          if-no-files-found: ignore
          retention-days: 7
